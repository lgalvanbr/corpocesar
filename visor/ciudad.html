<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Visor de ciudad · Corpocesar</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="hud.css">
</head>
<body>
<div class="hud">
  <div id="map"></div>

  <div class="hud-top">
    <div class="brand">
      <svg viewBox="0 0 200 220" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M100 8C60 70 30 108 30 148a70 70 0 00140 0c0-40-30-78-70-140z" stroke="#2563eb" stroke-width="10"/>
        <path d="M62 140c8-34 34-52 62-46-20 4-36 18-42 40-18 10-20 20-20 20s-4-10 0-14z" fill="#16a34a"/>
      </svg>
      <h1 id="ttl">Ciudad</h1>
    </div>
    <div class="sep"></div>
    <div class="hud-coords"><span><b id="hcLat">—</b> lat</span><span><b id="hcLon">—</b> lon</span><span>z<b id="hcZoom">—</b></span></div>
    <div class="hud-spacer"></div>
    <div class="hud-toggles">
      <label class="hud-chip"><input type="checkbox" id="terreno"> relieve 3D</label>
      <label class="hud-chip"><input type="checkbox" id="inclinar"> inclinar</label>
    </div>
    <button class="hud-iconbtn" id="panelToggle" title="Mostrar/ocultar panel" aria-label="Mostrar/ocultar panel" aria-expanded="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg>
    </button>
  </div>

  <aside class="hud-panel" id="panel">
    <div class="hud-panel-scroll">
      <div class="hud-sec"><h3>Métricas</h3><div class="kpis" id="kpis"></div></div>
      <div class="hud-sec"><h3>Capas</h3><div id="layers"></div><div id="leg"></div></div>
      <div class="hud-sec"><h3 id="infoT">Detalle</h3><div id="info">Pulse un edificio para ver sus datos.</div></div>
      <div class="hud-sec"><h3>Hechos verificados</h3><div class="hechos" id="hechos"></div><p class="nota" style="margin-top:8px">Cada hecho tiene su cita literal verificada contra la fuente; eso no garantiza que sea correcto.</p></div>
    </div>
  </aside>
</div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="config.js"></script>
<script src="navegacion.js"></script>
<script src="ciudad.js"></script>
</body>
</html>
